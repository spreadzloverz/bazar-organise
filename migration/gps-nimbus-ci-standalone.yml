name: GPS NIMBUS CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'assets/**'
      - 'web/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'assets/**'
      - 'web/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gps-nimbus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Environment
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Formatting
        run: |
          dart format lib test tool
          git diff --exit-code -- lib test tool

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Web build
        run: flutter build web --release --base-href /gps-nimbus/

      - name: Preserve web build for inspection
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gps-nimbus-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
